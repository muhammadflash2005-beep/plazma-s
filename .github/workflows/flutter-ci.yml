name: Flutter CI and Android build

concurrency:
  group: plazma-s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, feature/xender-style-connection, feature/unified-same-wifi-multi-device-rooms, feature/send-apps, feature/android-app-bundle-transfer]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.plazma --project-name plazma_s .
      - name: Render plasma-ball launcher artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=512 --height=512 assets/icon/plazma_s.svg --output=assets/icon/plazma_s.png
          file assets/icon/plazma_s.png
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      - name: Set Android app ID and LAN permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace('applicationId = "com.plazma.plazma_s"', 'applicationId = "com.plazma.s"')
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("applicationId 'com.plazma.plazma_s'", "applicationId 'com.plazma.s'")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              p.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VISUAL_USER_SELECTED" />
          """
          s = s.replace("<application", permissions + "\n    <application android:usesCleartextTraffic=\"true\"", 1)
          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/plazma_file_paths" />
              </provider>
          """
          service = """
              <service
                  android:name="com.plazma.plazma_s.TransferForegroundService"
                  android:exported="false"
                  android:foregroundServiceType="dataSync" />
          """
          s = s.replace("</application>", service + "\n" + provider + "\n    </application>", 1)
          # flutter create already generates MainActivity with singleTop launch mode.
          # Do not inject it again: duplicate XML attributes make AndroidManifest.xml invalid.
          if 'android:name=".MainActivity"' not in s or 'android:launchMode="singleTop"' not in s:
              raise SystemExit("Generated MainActivity manifest is missing its expected singleTop launch mode")
          manifest.write_text(s)
          gradle_kts = Path("android/app/build.gradle.kts")
          gradle_groovy = Path("android/app/build.gradle")
          gradle_file = gradle_kts if gradle_kts.exists() else gradle_groovy
          if gradle_file.exists():
              gradle_text = gradle_file.read_text()
              if "androidx.documentfile:documentfile" not in gradle_text:
                  if "dependencies {" in gradle_text:
                      gradle_text = gradle_text.replace(
                          "dependencies {",
                          'dependencies {\n    implementation("androidx.core:core:1.15.0")\n    implementation("androidx.documentfile:documentfile:1.0.1")',
                          1,
                      ) if gradle_file == gradle_kts else gradle_text.replace(
                          "dependencies {",
                          "dependencies {\n    implementation 'androidx.core:core:1.15.0'\n    implementation 'androidx.documentfile:documentfile:1.0.1'",
                          1,
                      )
                  else:
                      block = ('\ndependencies {\n    implementation("androidx.core:core:1.15.0")\n    implementation("androidx.documentfile:documentfile:1.0.1")\n}\n'
                               if gradle_file == gradle_kts else
                               "\ndependencies {\n    implementation 'androidx.core:core:1.15.0'\n    implementation 'androidx.documentfile:documentfile:1.0.1'\n}\n")
                      gradle_text += block
                  gradle_file.write_text(gradle_text)
          file_paths = Path("android/app/src/main/res/xml/plazma_file_paths.xml")
          file_paths.parent.mkdir(parents=True, exist_ok=True)
          file_paths.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="update_apks" path="." />
          </paths>
          """)
          main = Path("android/app/src/main/kotlin/com/plazma/plazma_s/MainActivity.kt")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package com.plazma.plazma_s

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.wifi.WifiManager
          import android.net.wifi.WifiNetworkSpecifier
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.os.Handler
          import android.os.Looper
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import android.net.Uri
          import java.io.File
          import androidx.core.content.FileProvider
          import androidx.core.content.ContextCompat
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.ActivityCompat
          import androidx.documentfile.provider.DocumentFile
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class TransferForegroundService : android.app.Service() {
              override fun onCreate() {
                  super.onCreate()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = android.app.NotificationChannel("plazma_transfer", "File transfers", android.app.NotificationManager.IMPORTANCE_LOW)
                      getSystemService(android.app.NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val openApp = Intent(this, MainActivity::class.java).apply {
                      setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  }
                  val pending = android.app.PendingIntent.getActivity(this, 0, openApp, android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE)
                  val notification = androidx.core.app.NotificationCompat.Builder(this, "plazma_transfer")
                      .setSmallIcon(android.R.drawable.stat_sys_upload)
                      .setContentTitle("Plazma S transfer active")
                      .setContentText("Your local Wi-Fi transfer is running")
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setCategory(androidx.core.app.NotificationCompat.CATEGORY_PROGRESS)
                      .build()
                  startForeground(45454, notification)
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): android.os.IBinder? = null
          }

          class MainActivity : FlutterActivity() {
              private val channelName = "com.plazma.s/hotspot"
              private val permissionRequest = 7041
              private var hotspotReservation: WifiManager.LocalOnlyHotspotReservation? = null
              private var pendingHotspotResult: MethodChannel.Result? = null
              private var networkCallback: ConnectivityManager.NetworkCallback? = null
              private var pendingJoinResult: MethodChannel.Result? = null
              private var pendingJoinSsid: String? = null
              private var pendingJoinPassword: String? = null
              private var pendingFolderPickerResult: MethodChannel.Result? = null

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 7044) return
                  val pending = pendingFolderPickerResult ?: return
                  pendingFolderPickerResult = null
                  if (resultCode != android.app.Activity.RESULT_OK) {
                      pending.error("FOLDER_PICKER_CANCELLED", "Folder selection was cancelled.", null)
                      return
                  }
                  val returnedIntent = data
                  val uri = returnedIntent?.data
                  if (returnedIntent == null || uri == null) {
                      pending.error("FOLDER_SELECTION_FAILED", "Android did not return a folder.", null)
                      return
                  }
                  try {
                      val flags = returnedIntent.flags and (Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION)
                      contentResolver.takePersistableUriPermission(uri, flags)
                      val folder = DocumentFile.fromTreeUri(this, uri)
                          ?: throw IllegalStateException("Android could not open the selected folder.")
                      pending.success(mapOf("uri" to uri.toString(), "name" to (folder.name ?: "Selected folder")))
                  } catch (error: Exception) {
                      pending.error("FOLDER_PERMISSION_FAILED", error.message, null)
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/device")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "getDeviceName") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val manufacturer = Build.MANUFACTURER.orEmpty().trim()
                          val model = Build.MODEL.orEmpty().trim()
                          val displayName = listOf(manufacturer, model)
                              .filter { it.isNotBlank() }
                              .distinct()
                              .joinToString(" ")
                              .ifBlank { "Android device" }
                          result.success(displayName)
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/storage")
                      .setMethodCallHandler { call, result ->
                          if (call.method == "releaseSaveFolder") {
                              val rawUri = call.argument<String>("uri")
                              if (!rawUri.isNullOrBlank()) {
                                  try {
                                      contentResolver.releasePersistableUriPermission(
                                          Uri.parse(rawUri),
                                          Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION
                                      )
                                  } catch (_: SecurityException) {
                                      // The provider may already have revoked this grant.
                                  }
                              }
                              result.success(null)
                              return@setMethodCallHandler
                          }
                          if (call.method == "selectSaveFolder") {
                              if (pendingFolderPickerResult != null) {
                                  result.error("FOLDER_PICKER_BUSY", "A folder picker is already open.", null)
                                  return@setMethodCallHandler
                              }
                              pendingFolderPickerResult = result
                              try {
                                  val picker = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE).apply {
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                                  }
                                  startActivityForResult(picker, 7044)
                              } catch (error: Exception) {
                                  pendingFolderPickerResult = null
                                  result.error("FOLDER_PICKER_FAILED", error.message, null)
                              }
                              return@setMethodCallHandler
                          }
                          if (call.method == "openSavedFile") {
                              val rawUri = call.argument<String>("uri")
                              if (rawUri.isNullOrBlank()) {
                                  result.error("INVALID_URI", "No saved file URI was supplied.", null)
                                  return@setMethodCallHandler
                              }
                              try {
                                  val uri = android.net.Uri.parse(rawUri)
                                  val mime = contentResolver.getType(uri) ?: "*/*"
                                  val openIntent = Intent(Intent.ACTION_VIEW).apply {
                                      setDataAndType(uri, mime)
                                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  }
                                  startActivity(openIntent)
                                  result.success(null)
                              } catch (error: Exception) {
                                  result.error("OPEN_FAILED", error.message, null)
                              }
                              return@setMethodCallHandler
                          }
                          if (call.method != "saveReceivedFile") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val sourcePath = call.argument<String>("sourcePath")
                          val requestedName = call.argument<String>("name")
                          val type = call.argument<String>("type") ?: "file"
                          val transferKey = call.argument<String>("transferKey").orEmpty()
                          val customFolderUri = call.argument<String>("customFolderUri")
                          if (sourcePath.isNullOrBlank() || requestedName.isNullOrBlank()) {
                              result.error("INVALID_SAVE", "A source file and name are required.", null)
                              return@setMethodCallHandler
                          }
                          val safeRequestedName = requestedName ?: "received_file"
                          val source = File(sourcePath)
                          if (!source.isFile) {
                              result.error("SOURCE_MISSING", "The completed temporary file is missing.", null)
                              return@setMethodCallHandler
                          }
                          val baseFolder = when (type) {
                              "image" -> android.os.Environment.DIRECTORY_PICTURES
                              "video" -> android.os.Environment.DIRECTORY_MOVIES
                              "music" -> android.os.Environment.DIRECTORY_MUSIC
                              "app" -> android.os.Environment.DIRECTORY_DOWNLOADS
                              else -> android.os.Environment.DIRECTORY_DOCUMENTS
                          }
                          val relativeFolder = "$baseFolder/Plazma S" + if (type == "app") "/${source.parentFile?.name ?: "Apps"}" else ""
                          val extension = safeRequestedName.substringAfterLast('.', "").lowercase()
                          val mime = android.webkit.MimeTypeMap.getSingleton().getMimeTypeFromExtension(extension)
                              ?: "application/octet-stream"
                          try {
                              if (!customFolderUri.isNullOrBlank()) {
                                  val root = DocumentFile.fromTreeUri(this, Uri.parse(customFolderUri))
                                      ?: throw IllegalStateException("The selected save folder is no longer available. Choose it again in Settings.")
                                  val destinationFolder = if (type == "app") {
                                      val packageFolderName = source.parentFile?.name ?: "Apps"
                                      root.findFile(packageFolderName) ?: root.createDirectory(packageFolderName)
                                          ?: throw IllegalStateException("Could not create the app folder in the selected destination.")
                                  } else root
                                  val savedKey = "plazma_saved_uri_" + transferKey
                                  val existingUri = getSharedPreferences("plazma_save_locations", MODE_PRIVATE).getString(savedKey, null)
                                  if (!existingUri.isNullOrBlank()) {
                                      val existing = DocumentFile.fromSingleUri(this, Uri.parse(existingUri))
                                      if (existing?.exists() == true) {
                                          result.success(mapOf("uri" to existingUri, "path" to ((destinationFolder.name ?: "Selected folder") + "/" + (existing.name ?: safeRequestedName))))
                                          return@setMethodCallHandler
                                      }
                                  }
                                  var finalName = safeRequestedName
                                  var suffix = 1
                                  val dot = safeRequestedName.lastIndexOf('.')
                                  val stem = if (dot > 0) safeRequestedName.substring(0, dot) else safeRequestedName
                                  val ext = if (dot > 0) safeRequestedName.substring(dot) else ""
                                  while (destinationFolder.findFile(finalName)?.exists() == true) {
                                      finalName = "$stem ($suffix)$ext"
                                      suffix++
                                  }
                                  val document = destinationFolder.createFile(mime, finalName)
                                      ?: throw IllegalStateException("Android could not create the file in the selected folder.")
                                  try {
                                      contentResolver.openOutputStream(document.uri, "w")?.use { output ->
                                          source.inputStream().use { input -> input.copyTo(output) }
                                      } ?: throw IllegalStateException("Android could not write to the selected folder.")
                                      getSharedPreferences("plazma_save_locations", MODE_PRIVATE).edit().putString(savedKey, document.uri.toString()).apply()
                                      if (type != "app") source.delete()
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          val channel = android.app.NotificationChannel("plazma_saved", "Saved files", android.app.NotificationManager.IMPORTANCE_DEFAULT)
                                          getSystemService(android.app.NotificationManager::class.java).createNotificationChannel(channel)
                                          val openIntent = Intent(Intent.ACTION_VIEW).apply {
                                              setDataAndType(document.uri, mime)
                                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                          }
                                          val pending = android.app.PendingIntent.getActivity(this, System.currentTimeMillis().toInt(), openIntent,
                                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE)
                                          val notification = androidx.core.app.NotificationCompat.Builder(this, "plazma_saved")
                                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                                              .setContentTitle("Saved to Plazma S")
                                              .setContentText((destinationFolder.name ?: "Selected folder") + "/" + finalName)
                                              .setContentIntent(pending)
                                              .setAutoCancel(true)
                                              .build()
                                          try {
                                              androidx.core.app.NotificationManagerCompat.from(this).notify(System.currentTimeMillis().toInt(), notification)
                                          } catch (_: SecurityException) {
                                              // File saving must still work when notifications are disabled.
                                          }
                                      }
                                      result.success(mapOf("uri" to document.uri.toString(), "path" to ((destinationFolder.name ?: "Selected folder") + "/" + finalName)))
                                  } catch (error: Exception) {
                                      document.delete()
                                      throw error
                                  }
                                  return@setMethodCallHandler
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val collection = when (type) {
                                      "image" -> android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                                      "video" -> android.provider.MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                                      "music" -> android.provider.MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                                      "app" -> android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI
                                      else -> android.provider.MediaStore.Files.getContentUri("external")
                                  }
                                  if (transferKey.isNotBlank()) {
                                      val selection = "description=? AND ${android.provider.MediaStore.MediaColumns.RELATIVE_PATH}=?"
                                      contentResolver.query(collection,
                                          arrayOf(android.provider.MediaStore.MediaColumns._ID,
                                              android.provider.MediaStore.MediaColumns.DISPLAY_NAME,
                                              android.provider.MediaStore.MediaColumns.IS_PENDING),
                                          selection, arrayOf("plazma:$transferKey", "$relativeFolder/"), null)?.use { cursor ->
                                          if (cursor.moveToFirst()) {
                                              val existingId = cursor.getLong(0)
                                              val existingName = cursor.getString(1)
                                              val pending = cursor.getInt(2)
                                              val existingUri = android.content.ContentUris.withAppendedId(collection, existingId)
                                              if (pending == 0) {
                                                  result.success(mapOf("uri" to existingUri.toString(), "path" to "$relativeFolder/$existingName"))
                                                  return@setMethodCallHandler
                                              } else {
                                                  contentResolver.delete(existingUri, null, null)
                                              }
                                          }
                                      }
                                  }
                                  var finalName = safeRequestedName
                                  var suffix = 1
                                  fun exists(name: String): Boolean {
                                      val selection = "${android.provider.MediaStore.MediaColumns.DISPLAY_NAME}=? AND ${android.provider.MediaStore.MediaColumns.RELATIVE_PATH}=?"
                                      return contentResolver.query(collection, arrayOf(android.provider.MediaStore.MediaColumns._ID),
                                          selection, arrayOf(name, "$relativeFolder/"), null)?.use { it.moveToFirst() } == true
                                  }
                                  val dot = safeRequestedName.lastIndexOf('.')
                                  val stem = if (dot > 0) safeRequestedName.substring(0, dot) else safeRequestedName
                                  val ext = if (dot > 0) safeRequestedName.substring(dot) else ""
                                  while (exists(finalName)) {
                                      finalName = "$stem ($suffix)$ext"
                                      suffix++
                                  }
                                  val values = android.content.ContentValues().apply {
                                      put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, finalName)
                                      put(android.provider.MediaStore.MediaColumns.MIME_TYPE, mime)
                                      put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, "$relativeFolder/")
                                      if (transferKey.isNotBlank()) put("description", "plazma:$transferKey")
                                      put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)
                                  }
                                  val uri = contentResolver.insert(collection, values)
                                      ?: throw IllegalStateException("Android could not create the media item.")
                                  try {
                                      contentResolver.openOutputStream(uri, "w")?.use { output ->
                                          source.inputStream().use { input -> input.copyTo(output) }
                                      } ?: throw IllegalStateException("Android could not open the media destination.")
                                      contentResolver.update(uri, android.content.ContentValues().apply {
                                          put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0)
                                      }, null, null)
                                      if (type != "app") source.delete()
                                      if (Build.VERSION.SDK_INT >= 33 &&
                                          androidx.core.content.ContextCompat.checkSelfPermission(this, android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED &&
                                          !getSharedPreferences("plazma_permissions", MODE_PRIVATE).getBoolean("notification_prompted", false)) {
                                          getSharedPreferences("plazma_permissions", MODE_PRIVATE).edit().putBoolean("notification_prompted", true).apply()
                                          androidx.core.app.ActivityCompat.requestPermissions(this, arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 7043)
                                      }
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          val channel = android.app.NotificationChannel("plazma_saved", "Saved files", android.app.NotificationManager.IMPORTANCE_DEFAULT)
                                          getSystemService(android.app.NotificationManager::class.java).createNotificationChannel(channel)
                                          val openIntent = Intent(Intent.ACTION_VIEW).apply {
                                              setDataAndType(uri, mime)
                                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                          }
                                          val pending = android.app.PendingIntent.getActivity(this, System.currentTimeMillis().toInt(), openIntent,
                                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_IMMUTABLE)
                                          val notification = androidx.core.app.NotificationCompat.Builder(this, "plazma_saved")
                                              .setSmallIcon(android.R.drawable.stat_sys_download_done)
                                              .setContentTitle("Saved to Plazma S")
                                              .setContentText("$relativeFolder/$finalName")
                                              .setContentIntent(pending)
                                              .setAutoCancel(true)
                                              .build()
                                          try {
                                              androidx.core.app.NotificationManagerCompat.from(this).notify(System.currentTimeMillis().toInt(), notification)
                                          } catch (_: SecurityException) {
                                              // Saving must still succeed when notification permission is denied.
                                          }
                                      }
                                      result.success(mapOf("uri" to uri.toString(), "path" to "$relativeFolder/$finalName"))
                                  } catch (error: Exception) {
                                      contentResolver.delete(uri, null, null)
                                      throw error
                                  }
                              } else {
                                  if (androidx.core.content.ContextCompat.checkSelfPermission(this, android.Manifest.permission.WRITE_EXTERNAL_STORAGE) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                      androidx.core.app.ActivityCompat.requestPermissions(this, arrayOf(android.Manifest.permission.WRITE_EXTERNAL_STORAGE), 7042)
                                      result.error("LEGACY_STORAGE_PERMISSION_REQUIRED", "Allow storage access, then retry saving this file.", null)
                                      return@setMethodCallHandler
                                  }
                                  val publicRoot = android.os.Environment.getExternalStoragePublicDirectory(baseFolder)
                                  val directory = File(publicRoot, "Plazma S" + if (type == "app") "/${source.parentFile?.name ?: "Apps"}" else "")
                                  if (!directory.exists() && !directory.mkdirs()) throw IllegalStateException("Could not create the public save folder.")
                                  var finalName = safeRequestedName
                                  var suffix = 1
                                  val dot = safeRequestedName.lastIndexOf('.')
                                  val stem = if (dot > 0) safeRequestedName.substring(0, dot) else safeRequestedName
                                  val ext = if (dot > 0) safeRequestedName.substring(dot) else ""
                                  while (File(directory, finalName).exists()) {
                                      finalName = "$stem ($suffix)$ext"
                                      suffix++
                                  }
                                  val output = File(directory, finalName)
                                  source.copyTo(output)
                                  if (type != "app") source.delete()
                                  android.media.MediaScannerConnection.scanFile(this, arrayOf(output.absolutePath), arrayOf(mime), null)
                                  result.success(mapOf("uri" to android.net.Uri.fromFile(output).toString(), "path" to output.absolutePath))
                              }
                          } catch (error: Exception) {
                              result.error("SAVE_FAILED", error.message, null)
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/transfer_service")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  try {
                                      ContextCompat.startForegroundService(this, Intent(this, TransferForegroundService::class.java))
                                      result.success(null)
                                  } catch (error: Exception) {
                                      result.error("TRANSFER_SERVICE_START_FAILED", error.message, null)
                                  }
                              }
                              "stop" -> {
                                  stopService(Intent(this, TransferForegroundService::class.java))
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/updater")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "installApk") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val path = call.argument<String>("path")
                          if (path.isNullOrBlank()) {
                              result.error("INVALID_APK", "No APK path was supplied.", null)
                              return@setMethodCallHandler
                          }
                          val apk = File(path)
                          if (!apk.exists() || !apk.isFile) {
                              result.error("APK_NOT_FOUND", "The downloaded APK could not be found.", null)
                              return@setMethodCallHandler
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                              startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                              result.error("INSTALL_PERMISSION_REQUIRED", "Allow installs from Plazma S in Android settings, return here, and tap Install update again.", null)
                              return@setMethodCallHandler
                          }
                          try {
                              val contentUri = FileProvider.getUriForFile(this, "$packageName.fileprovider", apk)
                              val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(contentUri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(installIntent)
                              result.success(null)
                          } catch (error: Exception) {
                              result.error("INSTALL_FAILED", error.message, null)
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/apps")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "listInstalledApps" -> {
                                  try {
                                      result.success(installedAppDetails())
                                  } catch (error: Exception) {
                                      result.error("APP_LIST_FAILED", error.message, null)
                                  }
                              }
                              "inspectApk" -> {
                                  val path = call.argument<String>("path").orEmpty()
                                  try {
                                      result.success(inspectApk(path))
                                  } catch (error: Exception) {
                                      result.error("APK_INSPECT_FAILED", error.message, null)
                                  }
                              }
                              "exportApks" -> {
                                  val packageNames = call.argument<List<String>>("packageNames") ?: emptyList()
                                  try {
                                      result.success(exportApks(packageNames))
                                  } catch (error: Exception) {
                                      result.error("APK_EXPORT_FAILED", error.message, null)
                                  }
                              }
                              "installApkSet" -> {
                                  val packageName = call.argument<String>("packageName") ?: ""
                                  val paths = call.argument<List<String>>("paths") ?: emptyList()
                                  try {
                                      installApkSet(packageName, paths)
                                      result.success(null)
                                  } catch (error: Exception) {
                                      result.error("APK_INSTALL_FAILED", error.message, null)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "startHotspot" -> startHotspot(result)
                              "stopHotspot" -> {
                                  hotspotReservation?.close()
                                  hotspotReservation = null
                                  result.success(null)
                              }
                              "joinHotspot" -> joinHotspot(
                                  call.argument<String>("ssid") ?: "",
                                  call.argument<String>("password") ?: "",
                                  result
                              )
                              "disconnectHotspot" -> disconnectHotspot(result)
                              "openWifiSettings" -> {
                                  startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent.action != "com.plazma.s.INSTALL_STATUS") return
                  val status = intent.getIntExtra(android.content.pm.PackageInstaller.EXTRA_STATUS, android.content.pm.PackageInstaller.STATUS_FAILURE)
                  val message = intent.getStringExtra(android.content.pm.PackageInstaller.EXTRA_STATUS_MESSAGE) ?: ""
                  if (status == android.content.pm.PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      @Suppress("DEPRECATION")
                      val confirmation = intent.getParcelableExtra<Intent>(Intent.EXTRA_INTENT)
                      if (confirmation != null) {
                          confirmation.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(confirmation)
                      }
                      return
                  }
                  val detail = when {
                      message.contains("VERSION_DOWNGRADE", ignoreCase = true) ->
                          "Android blocked this older app version. Install a newer or matching version instead."
                      status == android.content.pm.PackageInstaller.STATUS_SUCCESS -> "Installation completed."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_INVALID -> "The APK is invalid or corrupted."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_INCOMPATIBLE -> "This app is incompatible with this Android device or CPU architecture."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_CONFLICT -> "A different signature or package conflict prevents installation. Uninstalling the existing app may remove its data."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_STORAGE -> "Not enough storage is available to install this app."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_BLOCKED -> "Android or the device administrator blocked this installation."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_ABORTED -> "The installation was cancelled."
                      status == android.content.pm.PackageInstaller.STATUS_FAILURE_TIMEOUT -> "Android timed out while installing this app. Try again."
                      else -> message.ifBlank { "Android could not install this app (status $status)." }
                  }
                  flutterEngine?.dartExecutor?.binaryMessenger?.let { messenger ->
                      MethodChannel(messenger, "com.plazma.s/apps").invokeMethod(
                          "installStatus", mapOf("status" to status, "message" to detail)
                      )
                  }
              }

              private fun installedAppDetails(): List<Map<String, Any>> {
                  val packages = packageManager.getInstalledApplications(PackageManager.GET_META_DATA)
                  return packages.filter { (it.flags and android.content.pm.ApplicationInfo.FLAG_SYSTEM) == 0 }
                      .filter { !it.packageName.startsWith("org.chromium.webapk.") }
                      .mapNotNull { appInfo ->
                          try {
                              val info = packageManager.getPackageInfo(appInfo.packageName, 0)
                              val label = packageManager.getApplicationLabel(appInfo).toString()
                              val apkPaths = mutableListOf(appInfo.sourceDir).apply {
                                  appInfo.splitSourceDirs?.let { addAll(it) }
                              }
                              val bytes = apkPaths.sumOf { path -> File(path).takeIf { it.isFile }?.length() ?: 0L }
                              mapOf(
                                  "packageName" to appInfo.packageName,
                                  "appName" to label,
                                  "versionName" to (info.versionName ?: ""),
                                  "versionCode" to if (Build.VERSION.SDK_INT >= 28) info.longVersionCode else info.versionCode.toLong(),
                                  "sizeBytes" to bytes
                              )
                          } catch (_: Exception) { null }
                      }.sortedBy { it["appName"].toString().lowercase() }
              }

              private fun inspectApk(path: String): Map<String, Any?> {
                  if (path.isBlank()) throw IllegalArgumentException("An APK path is required.")
                  val apk = File(path)
                  if (!apk.isFile) throw IllegalStateException("The received base APK is missing.")
                  val info = packageManager.getPackageArchiveInfo(path, PackageManager.GET_ACTIVITIES)
                      ?: throw IllegalStateException("The APK is corrupted or is not a valid Android package.")
                  val application = info.applicationInfo ?: throw IllegalStateException("The APK has no application metadata.")
                  application.sourceDir = path
                  application.publicSourceDir = path
                  val drawable = application.loadIcon(packageManager)
                  val width = drawable.intrinsicWidth.coerceAtLeast(1)
                  val height = drawable.intrinsicHeight.coerceAtLeast(1)
                  val bitmap = android.graphics.Bitmap.createBitmap(width, height, android.graphics.Bitmap.Config.ARGB_8888)
                  val canvas = android.graphics.Canvas(bitmap)
                  drawable.setBounds(0, 0, canvas.width, canvas.height)
                  drawable.draw(canvas)
                  val stream = java.io.ByteArrayOutputStream()
                  bitmap.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, stream)
                  return mapOf(
                      "packageName" to info.packageName,
                      "appName" to packageManager.getApplicationLabel(application).toString(),
                      "versionName" to (info.versionName ?: ""),
                      "versionCode" to if (Build.VERSION.SDK_INT >= 28) info.longVersionCode else info.versionCode.toLong(),
                      "iconBase64" to android.util.Base64.encodeToString(stream.toByteArray(), android.util.Base64.NO_WRAP)
                  )
              }

              private fun exportApks(packageNames: List<String>): List<Map<String, Any>> {
                  val exported = mutableListOf<Map<String, Any>>()
                  packageNames.distinct().forEach { packageName ->
                      val appInfo = packageManager.getApplicationInfo(packageName, 0)
                      val appName = packageManager.getApplicationLabel(appInfo).toString()
                      val packageInfo = packageManager.getPackageInfo(packageName, 0)
                      val versionName = packageInfo.versionName ?: ""
                      val versionCode = if (Build.VERSION.SDK_INT >= 28) packageInfo.longVersionCode else packageInfo.versionCode.toLong()
                      val sourcePaths = mutableListOf(appInfo.sourceDir)
                      appInfo.splitSourceDirs?.let { sourcePaths.addAll(it) }
                      val outputDirectory = File(cacheDir, "plazma_shared_apps/$packageName")
                      if (!outputDirectory.exists() && !outputDirectory.mkdirs()) {
                          throw IllegalStateException("Could not create APK export directory for $packageName")
                      }
                      sourcePaths.forEachIndexed { index, sourcePath ->
                          val source = File(sourcePath)
                          if (!source.isFile) throw IllegalStateException("APK source is missing for $packageName")
                          val fileName = if (index == 0) "base.apk" else {
                              val sourceName = source.name
                              if (sourceName.startsWith("split_") && sourceName.endsWith(".apk", ignoreCase = true)) {
                                  sourceName
                              } else {
                                  "split_$index.apk"
                              }
                          }
                          val destination = File(outputDirectory, fileName)
                          source.copyTo(destination, overwrite = true)
                          exported.add(mapOf(
                              "packageName" to packageName,
                              "appName" to appName,
                              "versionName" to versionName,
                              "versionCode" to versionCode,
                              "relativePath" to "$packageName/$fileName",
                              "path" to destination.absolutePath,
                              "size" to destination.length()
                          ))
                      }
                  }
                  return exported
              }

              private fun installApkSet(packageName: String, paths: List<String>) {
                  if (packageName.isBlank() || paths.isEmpty() || paths.size > 100) {
                      throw IllegalArgumentException("A package and between one and 100 APK files are required.")
                  }
                  if (!File(paths.first()).name.equals("base.apk", ignoreCase = true)) {
                      throw IllegalStateException("The base APK must be first in the installation set.")
                  }
                  val splitNames = mutableSetOf<String>()
                  paths.forEachIndexed { index, path ->
                      val apk = File(path)
                      if (!apk.isFile || apk.length() == 0L) {
                          throw IllegalStateException("APK file is missing or empty: $path")
                      }
                      if (!splitNames.add(apk.name)) {
                          throw IllegalStateException("The installation set contains a duplicate APK part: ${apk.name}")
                      }
                      if (index == 0) {
                          // PackageManager can inspect the standalone base APK.
                          // Configuration split APKs are not standalone packages:
                          // validating them with getPackageArchiveInfo rejects valid
                          // files such as split_config.en.apk. PackageInstaller
                          // validates the complete set when the session is committed.
                          val info = packageManager.getPackageArchiveInfo(path, 0)
                              ?: throw IllegalStateException("The base APK is corrupted or unreadable: $path")
                          if (info.packageName != packageName) {
                              throw IllegalStateException("APK package mismatch. Expected $packageName but found ${info.packageName}.")
                          }
                      } else if (!apk.name.startsWith("split_") || !apk.name.endsWith(".apk", ignoreCase = true)) {
                          throw IllegalStateException("An APK split has an invalid file name: ${apk.name}")
                      }
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                      startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${this.packageName}")))
                      throw IllegalStateException("Allow Plazma S to install apps in Android settings, return, then tap Install again.")
                  }
                  val params = android.content.pm.PackageInstaller.SessionParams(
                      android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL
                  )
                  params.setAppPackageName(packageName)
                  val installer = packageManager.packageInstaller
                  val sessionId = installer.createSession(params)
                  val session = installer.openSession(sessionId)
                  try {
                      paths.forEachIndexed { index, path ->
                          val apk = File(path)
                          if (!apk.isFile) throw IllegalStateException("APK file is missing: $path")
                          val entryName = apk.name
                          session.openWrite(entryName, 0, apk.length()).use { output ->
                              apk.inputStream().use { input -> input.copyTo(output) }
                              session.fsync(output)
                          }
                      }
                      val callbackIntent = Intent(this, MainActivity::class.java).apply {
                          action = "com.plazma.s.INSTALL_STATUS"
                          addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                      val callback = android.app.PendingIntent.getActivity(
                          this,
                          sessionId,
                          callbackIntent,
                          android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                      )
                      session.commit(callback.intentSender)
                      session.close()
                  } catch (error: Exception) {
                      session.abandon()
                      throw error
                  }
              }

              private fun startHotspot(result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      result.error("UNSUPPORTED", "Android 8 or later is required for app-created local hotspots.", null)
                      return
                  }
                  if (hotspotReservation != null) {
                      result.error("ALREADY_RUNNING", "A Plazma S hotspot is already running.", null)
                      return
                  }
                  val permission = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.NEARBY_WIFI_DEVICES
                  } else {
                      Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (checkSelfPermission(permission) != PackageManager.PERMISSION_GRANTED) {
                      pendingHotspotResult = result
                      ActivityCompat.requestPermissions(this, arrayOf(permission), permissionRequest)
                      return
                  }
                  beginHotspot(result)
              }

              private fun beginHotspot(result: MethodChannel.Result) {
                  val wifi = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  try {
                      wifi.startLocalOnlyHotspot(object : WifiManager.LocalOnlyHotspotCallback() {
                          override fun onStarted(reservation: WifiManager.LocalOnlyHotspotReservation) {
                              hotspotReservation = reservation
                              val ssid: String
                              val password: String
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  val config = reservation.softApConfiguration
                                  ssid = config.ssid ?: ""
                                  password = config.passphrase ?: ""
                              } else {
                                  @Suppress("DEPRECATION")
                                  val config = reservation.wifiConfiguration
                                  ssid = config?.SSID?.trim('"') ?: ""
                                  password = config?.preSharedKey?.trim('"') ?: ""
                              }
                              runOnUiThread {
                                  fun respondWhenReady(attempt: Int) {
                                      val host = findHotspotAddress()
                                      if (host != null) {
                                          result.success(mapOf("ssid" to ssid, "password" to password, "host" to host))
                                      } else if (attempt < 10) {
                                          Handler(Looper.getMainLooper()).postDelayed({ respondWhenReady(attempt + 1) }, 500)
                                      } else {
                                          result.error("HOTSPOT_ADDRESS_UNAVAILABLE", "Android started the hotspot but its local IP address could not be detected after 5 seconds.", null)
                                      }
                                  }
                                  respondWhenReady(0)
                              }
                          }

                          override fun onStopped() {
                              hotspotReservation = null
                          }

                          override fun onFailed(reason: Int) {
                              hotspotReservation = null
                              runOnUiThread {
                                  val detail = when (reason) {
                                      1 -> "Android could not allocate a Wi-Fi channel."
                                      2 -> "Android reported a general hotspot startup failure."
                                      3 -> "Android reports an incompatible Wi-Fi mode. Turn off the phone's portable hotspot/tethering, disconnect Wi-Fi Direct or other Wi-Fi sharing sessions, then retry."
                                      4 -> "Android or the device policy does not allow hotspot creation."
                                      else -> "Android returned hotspot error $reason."
                                  }
                                  result.error("HOTSPOT_FAILED", detail, mapOf("reason" to reason))
                              }
                          }
                      }, null)
                  } catch (error: SecurityException) {
                      result.error("PERMISSION_DENIED", error.message, null)
                  } catch (error: Exception) {
                      result.error("HOTSPOT_FAILED", error.message, null)
                  }
              }

              @Deprecated("Deprecated in Android")
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode != permissionRequest) return
                  val result = pendingHotspotResult
                  pendingHotspotResult = null
                  val joinResult = pendingJoinResult
                  val joinSsid = pendingJoinSsid
                  val joinPassword = pendingJoinPassword
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (result != null) {
                          beginHotspot(result)
                      } else if (joinResult != null && joinSsid != null && joinPassword != null) {
                          pendingJoinSsid = null
                          pendingJoinPassword = null
                          joinHotspot(joinSsid, joinPassword, joinResult)
                      }
                  } else {
                      result?.error("PERMISSION_DENIED", "Nearby Wi-Fi permission is required to create a local hotspot.", null)
                      joinResult?.error("PERMISSION_DENIED", "Nearby Wi-Fi permission is required to join a local hotspot.", null)
                      pendingJoinResult = null
                      pendingJoinSsid = null
                      pendingJoinPassword = null
                  }
              }

              private fun findHotspotAddress(): String? {
                  return try {
                      val connectivity = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      val defaultInterface = connectivity.activeNetwork
                          ?.let { connectivity.getLinkProperties(it)?.interfaceName }
                      val interfaces = NetworkInterface.getNetworkInterfaces().toList()
                          .filter { it.isUp && !it.isLoopback }
                      // Never advertise the phone's ordinary Wi-Fi/mobile interface.
                      // A receiver joins the isolated SoftAP, so its address must belong
                      // to the hotspot interface, not the sender's upstream LAN.
                      val candidates = interfaces
                          .filter { it.name != defaultInterface }
                          .sortedBy {
                              val name = it.name.lowercase()
                              when {
                                  name.contains("softap") || name.startsWith("ap") ||
                                      name.startsWith("swlan") -> 0
                                  name.contains("wlan") -> 1
                                  else -> 2
                              }
                          }
                      val addresses = candidates.flatMap { networkInterface ->
                          networkInterface.inetAddresses.toList()
                              .filterIsInstance<Inet4Address>()
                              .filter { address ->
                                  !address.isLoopbackAddress && !address.isLinkLocalAddress &&
                                      (address.hostAddress.startsWith("192.168.") ||
                                       address.hostAddress.startsWith("10.") ||
                                       address.hostAddress.startsWith("172."))
                              }
                              .map { address ->
                                  val host = address.hostAddress
                                  val preferred = host.endsWith(".1") || host.endsWith(".254")
                                  Triple(if (preferred) 0 else 1, networkInterface.name, host)
                              }
                      }
                      addresses.sortedBy { it.first }.firstOrNull()?.third
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun joinHotspot(ssid: String, password: String, result: MethodChannel.Result) {
                  if (ssid.isBlank() || password.isBlank()) {
                      result.error("INVALID_WIFI_DETAILS", "The QR code does not contain valid Wi-Fi credentials.", null)
                      return
                  }
                  val wifiPermission = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.NEARBY_WIFI_DEVICES
                  } else {
                      Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (checkSelfPermission(wifiPermission) != PackageManager.PERMISSION_GRANTED) {
                      pendingJoinSsid = ssid
                      pendingJoinPassword = password
                      pendingJoinResult = result
                      ActivityCompat.requestPermissions(this, arrayOf(wifiPermission), permissionRequest)
                      return
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      result.error("MANUAL_WIFI_REQUIRED", "This Android version requires joining the Plazma S Wi-Fi network from Wi-Fi settings.", null)
                      return
                  }
                  disconnectHotspot(null)
                  try {
                      val specifier = WifiNetworkSpecifier.Builder()
                          .setSsid(ssid)
                          .setWpa2Passphrase(password)
                          .build()
                      val request = NetworkRequest.Builder()
                          .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                          .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          .setNetworkSpecifier(specifier)
                          .build()
                      val connectivity = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      pendingJoinResult = result
                      val callback = object : ConnectivityManager.NetworkCallback() {
                          override fun onAvailable(network: Network) {
                              connectivity.bindProcessToNetwork(network)
                              runOnUiThread {
                                  pendingJoinResult?.success(null)
                                  pendingJoinResult = null
                              }
                          }
                          override fun onUnavailable() {
                              runOnUiThread {
                                  pendingJoinResult?.error("WIFI_JOIN_REJECTED", "The Wi-Fi connection was cancelled or the phone could not join the sender's hotspot.", null)
                                  pendingJoinResult = null
                                  networkCallback = null
                              }
                          }
                      }
                      networkCallback = callback
                      connectivity.requestNetwork(request, callback, 30000)
                  } catch (error: SecurityException) {
                      pendingJoinResult = null
                      result.error("WIFI_PERMISSION_REQUIRED", "Allow Nearby Wi-Fi access for Plazma S, then scan the QR code again.", null)
                  } catch (error: Exception) {
                      pendingJoinResult = null
                      result.error("WIFI_JOIN_FAILED", error.message, null)
                  }
              }

              private fun disconnectHotspot(result: MethodChannel.Result?) {
                  try {
                      val connectivity = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      connectivity.bindProcessToNetwork(null)
                      networkCallback?.let { connectivity.unregisterNetworkCallback(it) }
                      networkCallback = null
                      pendingJoinResult = null
                      result?.success(null)
                  } catch (error: Exception) {
                      result?.error("WIFI_DISCONNECT_FAILED", error.message, null)
                  }
              }

              override fun onDestroy() {
                  disconnectHotspot(null)
                  hotspotReservation?.close()
                  hotspotReservation = null
                  super.onDestroy()
              }
          }
          ''')
