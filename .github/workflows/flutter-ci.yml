name: Flutter CI and Android build

concurrency:
  group: plazma-s-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.plazma --project-name plazma_s .
      - name: Render plasma-ball launcher artwork
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width=512 --height=512 assets/icon/plazma_s.svg --output=assets/icon/plazma_s.png
          file assets/icon/plazma_s.png
      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons
      - name: Set Android app ID and LAN permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace('applicationId = "com.plazma.plazma_s"', 'applicationId = "com.plazma.s"')
              s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24')
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace("applicationId 'com.plazma.plazma_s'", "applicationId 'com.plazma.s'")
              s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              p.write_text(s)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
          """
          s = s.replace("<application", permissions + "\\n    <application", 1)
          provider = """
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/plazma_file_paths" />
              </provider>
          """
          s = s.replace("</application>", provider + "\n    </application>", 1)
          manifest.write_text(s)
          gradle_kts = Path("android/app/build.gradle.kts")
          if gradle_kts.exists():
              gradle_text = gradle_kts.read_text()
              gradle_text = gradle_text.replace(
                  "dependencies {",
                  'dependencies {\n    implementation("androidx.core:core:1.15.0")',
                  1,
              )
              gradle_kts.write_text(gradle_text)
          file_paths = Path("android/app/src/main/res/xml/plazma_file_paths.xml")
          file_paths.parent.mkdir(parents=True, exist_ok=True)
          file_paths.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="update_apks" path="." />
          </paths>
          """)
          main = Path("android/app/src/main/kotlin/com/plazma/plazma_s/MainActivity.kt")
          main.parent.mkdir(parents=True, exist_ok=True)
          main.write_text(r'''package com.plazma.plazma_s

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.wifi.WifiManager
          import android.net.wifi.WifiNetworkSpecifier
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.os.Handler
          import android.os.Looper
          import java.net.Inet4Address
          import java.net.NetworkInterface
          import android.net.Uri
          import java.io.File
          import androidx.core.content.FileProvider
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.ActivityCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "com.plazma.s/hotspot"
              private val permissionRequest = 7041
              private var hotspotReservation: WifiManager.LocalOnlyHotspotReservation? = null
              private var pendingHotspotResult: MethodChannel.Result? = null
              private var networkCallback: ConnectivityManager.NetworkCallback? = null
              private var pendingJoinResult: MethodChannel.Result? = null
              private var pendingJoinSsid: String? = null
              private var pendingJoinPassword: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/updater")
                      .setMethodCallHandler { call, result ->
                          if (call.method != "installApk") {
                              result.notImplemented()
                              return@setMethodCallHandler
                          }
                          val path = call.argument<String>("path")
                          if (path.isNullOrBlank()) {
                              result.error("INVALID_APK", "No APK path was supplied.", null)
                              return@setMethodCallHandler
                          }
                          val apk = File(path)
                          if (!apk.exists() || !apk.isFile) {
                              result.error("APK_NOT_FOUND", "The downloaded APK could not be found.", null)
                              return@setMethodCallHandler
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                              startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:$packageName")))
                              result.error("INSTALL_PERMISSION_REQUIRED", "Allow installs from Plazma S in Android settings, return here, and tap Install update again.", null)
                              return@setMethodCallHandler
                          }
                          try {
                              val contentUri = FileProvider.getUriForFile(this, "$packageName.fileprovider", apk)
                              val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(contentUri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(installIntent)
                              result.success(null)
                          } catch (error: Exception) {
                              result.error("INSTALL_FAILED", error.message, null)
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "com.plazma.s/apps")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "exportApks" -> {
                                  val packageNames = call.argument<List<String>>("packageNames") ?: emptyList()
                                  try {
                                      result.success(exportApks(packageNames))
                                  } catch (error: Exception) {
                                      result.error("APK_EXPORT_FAILED", error.message, null)
                                  }
                              }
                              "installApkSet" -> {
                                  val packageName = call.argument<String>("packageName") ?: ""
                                  val paths = call.argument<List<String>>("paths") ?: emptyList()
                                  try {
                                      installApkSet(packageName, paths)
                                      result.success(null)
                                  } catch (error: Exception) {
                                      result.error("APK_INSTALL_FAILED", error.message, null)
                                  }
                              }
                              else -> result.notImplemented()
                          }
                      }
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "startHotspot" -> startHotspot(result)
                              "stopHotspot" -> {
                                  hotspotReservation?.close()
                                  hotspotReservation = null
                                  result.success(null)
                              }
                              "joinHotspot" -> joinHotspot(
                                  call.argument<String>("ssid") ?: "",
                                  call.argument<String>("password") ?: "",
                                  result
                              )
                              "disconnectHotspot" -> disconnectHotspot(result)
                              "openWifiSettings" -> {
                                  startActivity(Intent(Settings.ACTION_WIFI_SETTINGS))
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun exportApks(packageNames: List<String>): List<Map<String, Any>> {
                  val exported = mutableListOf<Map<String, Any>>()
                  packageNames.distinct().forEach { packageName ->
                      val appInfo = packageManager.getApplicationInfo(packageName, 0)
                      val appName = packageManager.getApplicationLabel(appInfo).toString()
                      val sourcePaths = mutableListOf(appInfo.sourceDir)
                      appInfo.splitSourceDirs?.let { sourcePaths.addAll(it) }
                      val outputDirectory = File(cacheDir, "plazma_shared_apps/$packageName")
                      if (!outputDirectory.exists() && !outputDirectory.mkdirs()) {
                          throw IllegalStateException("Could not create APK export directory for $packageName")
                      }
                      sourcePaths.forEachIndexed { index, sourcePath ->
                          val source = File(sourcePath)
                          if (!source.isFile) throw IllegalStateException("APK source is missing for $packageName")
                          val fileName = if (index == 0) "base.apk" else "split_$index.apk"
                          val destination = File(outputDirectory, fileName)
                          source.copyTo(destination, overwrite = true)
                          exported.add(mapOf(
                              "packageName" to packageName,
                              "appName" to appName,
                              "relativePath" to "$packageName/$fileName",
                              "path" to destination.absolutePath,
                              "size" to destination.length()
                          ))
                      }
                  }
                  return exported
              }

              private fun installApkSet(packageName: String, paths: List<String>) {
                  if (packageName.isBlank() || paths.isEmpty()) {
                      throw IllegalArgumentException("An app package and its APK files are required.")
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {
                      startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${this.packageName}")))
                      throw IllegalStateException("Allow Plazma S to install apps in Android settings, return, then tap Install again.")
                  }
                  val params = android.content.pm.PackageInstaller.SessionParams(
                      android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL
                  )
                  params.setAppPackageName(packageName)
                  val installer = packageManager.packageInstaller
                  val sessionId = installer.createSession(params)
                  val session = installer.openSession(sessionId)
                  try {
                      paths.forEachIndexed { index, path ->
                          val apk = File(path)
                          if (!apk.isFile) throw IllegalStateException("APK file is missing: $path")
                          val entryName = if (index == 0) "base.apk" else "split_$index.apk"
                          session.openWrite(entryName, 0, apk.length()).use { output ->
                              apk.inputStream().use { input -> input.copyTo(output) }
                              session.fsync(output)
                          }
                      }
                      val callbackIntent = Intent(this, MainActivity::class.java).apply {
                          action = "com.plazma.s.INSTALL_STATUS"
                          addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                      val callback = android.app.PendingIntent.getActivity(
                          this,
                          sessionId,
                          callbackIntent,
                          android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                      )
                      session.commit(callback.intentSender)
                  } catch (error: Exception) {
                      session.abandon()
                      throw error
                  }
              }

              private fun startHotspot(result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) {
                      result.error("UNSUPPORTED", "Android 8 or later is required for app-created local hotspots.", null)
                      return
                  }
                  if (hotspotReservation != null) {
                      result.error("ALREADY_RUNNING", "A Plazma S hotspot is already running.", null)
                      return
                  }
                  val permission = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.NEARBY_WIFI_DEVICES
                  } else {
                      Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (checkSelfPermission(permission) != PackageManager.PERMISSION_GRANTED) {
                      pendingHotspotResult = result
                      ActivityCompat.requestPermissions(this, arrayOf(permission), permissionRequest)
                      return
                  }
                  beginHotspot(result)
              }

              private fun beginHotspot(result: MethodChannel.Result) {
                  val wifi = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
                  try {
                      wifi.startLocalOnlyHotspot(object : WifiManager.LocalOnlyHotspotCallback() {
                          override fun onStarted(reservation: WifiManager.LocalOnlyHotspotReservation) {
                              hotspotReservation = reservation
                              val ssid: String
                              val password: String
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                                  val config = reservation.softApConfiguration
                                  ssid = config.ssid ?: ""
                                  password = config.passphrase ?: ""
                              } else {
                                  @Suppress("DEPRECATION")
                                  val config = reservation.wifiConfiguration
                                  ssid = config?.SSID?.trim('"') ?: ""
                                  password = config?.preSharedKey?.trim('"') ?: ""
                              }
                              runOnUiThread {
                                  val host = findHotspotAddress()
                                  if (host == null) {
                                      result.error("HOTSPOT_ADDRESS_UNAVAILABLE", "Android started the hotspot but its local IP address could not be detected.", null)
                                  } else {
                                      result.success(mapOf("ssid" to ssid, "password" to password, "host" to host))
                                  }
                              }
                          }

                          override fun onStopped() {
                              hotspotReservation = null
                          }

                          override fun onFailed(reason: Int) {
                              runOnUiThread {
                                  result.error("HOTSPOT_FAILED", "Android could not start the local hotspot (reason $reason). Turn off any existing hotspot and try again.", null)
                              }
                          }
                      }, null)
                  } catch (error: SecurityException) {
                      result.error("PERMISSION_DENIED", error.message, null)
                  } catch (error: Exception) {
                      result.error("HOTSPOT_FAILED", error.message, null)
                  }
              }

              @Deprecated("Deprecated in Android")
              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode != permissionRequest) return
                  val result = pendingHotspotResult
                  pendingHotspotResult = null
                  val joinResult = pendingJoinResult
                  val joinSsid = pendingJoinSsid
                  val joinPassword = pendingJoinPassword
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      if (result != null) {
                          beginHotspot(result)
                      } else if (joinResult != null && joinSsid != null && joinPassword != null) {
                          pendingJoinSsid = null
                          pendingJoinPassword = null
                          joinHotspot(joinSsid, joinPassword, joinResult)
                      }
                  } else {
                      result?.error("PERMISSION_DENIED", "Nearby Wi-Fi permission is required to create a local hotspot.", null)
                      joinResult?.error("PERMISSION_DENIED", "Nearby Wi-Fi permission is required to join a local hotspot.", null)
                      pendingJoinResult = null
                      pendingJoinSsid = null
                      pendingJoinPassword = null
                  }
              }

              private fun findHotspotAddress(): String? {
                  return try {
                      val interfaces = NetworkInterface.getNetworkInterfaces().toList()
                      val candidates = interfaces
                          .filter { it.isUp && !it.isLoopback }
                          .sortedBy {
                              val name = it.name.lowercase()
                              when {
                                  name.contains("ap") || name.contains("softap") -> 0
                                  name.contains("wlan") -> 1
                                  else -> 2
                              }
                          }
                      candidates.forEach { networkInterface ->
                          networkInterface.inetAddresses.toList()
                              .filterIsInstance<Inet4Address>()
                              .firstOrNull { address ->
                                  !address.isLoopbackAddress && !address.isLinkLocalAddress &&
                                      (address.hostAddress.startsWith("192.168.") ||
                                       address.hostAddress.startsWith("10.") ||
                                       address.hostAddress.startsWith("172."))
                              }?.let { return it.hostAddress }
                      }
                      null
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun joinHotspot(ssid: String, password: String, result: MethodChannel.Result) {
                  if (ssid.isBlank() || password.isBlank()) {
                      result.error("INVALID_WIFI_DETAILS", "The QR code does not contain valid Wi-Fi credentials.", null)
                      return
                  }
                  val wifiPermission = if (Build.VERSION.SDK_INT >= 33) {
                      Manifest.permission.NEARBY_WIFI_DEVICES
                  } else {
                      Manifest.permission.ACCESS_FINE_LOCATION
                  }
                  if (checkSelfPermission(wifiPermission) != PackageManager.PERMISSION_GRANTED) {
                      pendingJoinSsid = ssid
                      pendingJoinPassword = password
                      pendingJoinResult = result
                      ActivityCompat.requestPermissions(this, arrayOf(wifiPermission), permissionRequest)
                      return
                  }
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      result.error("MANUAL_WIFI_REQUIRED", "This Android version requires joining the Plazma S Wi-Fi network from Wi-Fi settings.", null)
                      return
                  }
                  disconnectHotspot(null)
                  try {
                      val specifier = WifiNetworkSpecifier.Builder()
                          .setSsid(ssid)
                          .setWpa2Passphrase(password)
                          .build()
                      val request = NetworkRequest.Builder()
                          .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                          .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          .setNetworkSpecifier(specifier)
                          .build()
                      val connectivity = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      pendingJoinResult = result
                      val callback = object : ConnectivityManager.NetworkCallback() {
                          override fun onAvailable(network: Network) {
                              connectivity.bindProcessToNetwork(network)
                              runOnUiThread {
                                  pendingJoinResult?.success(null)
                                  pendingJoinResult = null
                              }
                          }
                          override fun onUnavailable() {
                              runOnUiThread {
                                  pendingJoinResult?.error("WIFI_JOIN_REJECTED", "The Wi-Fi connection was cancelled or the phone could not join the sender's hotspot.", null)
                                  pendingJoinResult = null
                                  networkCallback = null
                              }
                          }
                      }
                      networkCallback = callback
                      connectivity.requestNetwork(request, callback, 30000)
                  } catch (error: SecurityException) {
                      pendingJoinResult = null
                      result.error("WIFI_PERMISSION_REQUIRED", "Allow Nearby Wi-Fi access for Plazma S, then scan the QR code again.", null)
                  } catch (error: Exception) {
                      pendingJoinResult = null
                      result.error("WIFI_JOIN_FAILED", error.message, null)
                  }
              }

              private fun disconnectHotspot(result: MethodChannel.Result?) {
                  try {
                      val connectivity = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                      connectivity.bindProcessToNetwork(null)
                      networkCallback?.let { connectivity.unregisterNetworkCallback(it) }
                      networkCallback = null
                      pendingJoinResult = null
                      result?.success(null)
                  } catch (error: Exception) {
                      result?.error("WIFI_DISCONNECT_FAILED", error.message, null)
                  }
              }

              override fun onDestroy() {
                  disconnectHotspot(null)
                  hotspotReservation?.close()
                  hotspotReservation = null
                  super.onDestroy()
              }
          }
          ''')
          PY
      - name: Configure permanent Android release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEY_ALIAS",
              "ANDROID_STORE_PASSWORD",
              "ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          android = Path("android")
          keystore = android / "app" / "plazma-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))

          def prop(value):
              return (value.replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ "))

          (android / "key.properties").write_text(
              "storeFile=plazma-release.jks\n"
              f"storePassword={prop(os.environ['ANDROID_STORE_PASSWORD'])}\n"
              f"keyPassword={prop(os.environ['ANDROID_KEY_PASSWORD'])}\n"
              f"keyAlias={prop(os.environ['ANDROID_KEY_ALIAS'])}\n"
          )

          gradle_kts = android / "app" / "build.gradle.kts"
          gradle = android / "app" / "build.gradle"
          if gradle_kts.exists():
              p = gradle_kts
              s = p.read_text()
              imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
              s = imports + s
              marker = "android {"
              signing = """
          val signingProperties = Properties()
          val signingFile = rootProject.file("key.properties")
          if (signingFile.exists()) {
              signingProperties.load(FileInputStream(signingFile))
          }

              signingConfigs {
                  create("release") {
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                  }
              }
          """
              s = s.replace(marker, marker + signing, 1)
              s = s.replace("signingConfig = signingConfigs.debug", 'signingConfig = signingConfigs.getByName("release")')
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              s = s.replace("signingConfig = signingConfigs.debug", 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          elif gradle.exists():
              s = gradle.read_text()
              block = """
          def signingProperties = new Properties()
          def signingFile = rootProject.file("key.properties")
          if (signingFile.exists()) {
              signingProperties.load(new FileInputStream(signingFile))
          }

          """
              s = block + s
              s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file(signingProperties['storeFile'])
                      storePassword signingProperties['storePassword']
                      keyAlias signingProperties['keyAlias']
                      keyPassword signingProperties['keyPassword']
                  }
              }
          """, 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              gradle.write_text(s)
          else:
              raise SystemExit("Generated Android Gradle file not found")
          print("Permanent Android release signing configured.")
          PY
      - name: Validate permanent Android signing credentials
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="android/app/plazma-release.jks"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" >/tmp/plazma-keystore-check.txt 2>&1 || {
            echo "Release keystore password check failed:"
            cat /tmp/plazma-keystore-check.txt
            exit 1
          }
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/tmp/plazma-alias-check.txt 2>&1 || {
            echo "Release key alias check failed. Confirm ANDROID_KEY_ALIAS matches the alias inside the keystore."
            cat /tmp/plazma-alias-check.txt
            exit 1
          }
          keytool -certreq -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file /tmp/plazma-signing-check.csr >/tmp/plazma-key-check.txt 2>&1 || {
            echo "Release private-key password check failed. Confirm ANDROID_KEY_PASSWORD."
            cat /tmp/plazma-key-check.txt
            exit 1
          }
          rm -f /tmp/plazma-signing-check.csr /tmp/plazma-keystore-check.txt /tmp/plazma-alias-check.txt /tmp/plazma-key-check.txt
          echo "Verified: keystore password, key alias, and private-key password are valid."

      - name: Build Android APK
        run: flutter build apk --release
      - name: Verify APK uses permanent release certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          APK_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          KEY_CERT="$(keytool -exportcert -keystore android/app/plazma-release.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          echo "APK signer SHA-256: $APK_CERT"
          echo "Keystore SHA-256:   $KEY_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "Verified: APK is signed by the permanent Plazma S release certificate."
      - name: Build web preview
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: plazma-s-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Generate APK checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: true
