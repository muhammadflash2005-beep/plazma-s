      - name: Verify Android app export and PackageInstaller wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml").read_text()
          source = Path("android/app/src/main/kotlin/com/plazma/plazma_s/MainActivity.kt").read_text()
          required_manifest = [
              "android.permission.QUERY_ALL_PACKAGES",
              "android.permission.REQUEST_INSTALL_PACKAGES",
