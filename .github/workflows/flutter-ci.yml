          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEY_ALIAS",
              "ANDROID_STORE_PASSWORD",
              "ANDROID_KEY_PASSWORD",
          ]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          android = Path("android")
          keystore = android / "app" / "plazma-release.jks"
          keystore.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))

          def prop(value):
              return (value.replace("\\", "\\\\")
                           .replace(":", "\\:")
                           .replace("=", "\\=")
                           .replace(" ", "\\ "))

          (android / "key.properties").write_text(
              "storeFile=plazma-release.jks\n"
              f"storePassword={prop(os.environ['ANDROID_STORE_PASSWORD'])}\n"
              f"keyPassword={prop(os.environ['ANDROID_KEY_PASSWORD'])}\n"
              f"keyAlias={prop(os.environ['ANDROID_KEY_ALIAS'])}\n"
          )

          gradle_kts = android / "app" / "build.gradle.kts"
          gradle = android / "app" / "build.gradle"
          if gradle_kts.exists():
              p = gradle_kts
              s = p.read_text()
              imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
              s = imports + s
              marker = "android {"
              signing = """
          val signingProperties = Properties()
          val signingFile = rootProject.file("key.properties")
          if (signingFile.exists()) {
              signingProperties.load(FileInputStream(signingFile))
          }

              signingConfigs {
                  create("release") {
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                  }
              }
          """
              s = s.replace(marker, marker + signing, 1)
              s = s.replace("signingConfig = signingConfigs.debug", 'signingConfig = signingConfigs.getByName("release")')
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              s = s.replace("signingConfig = signingConfigs.debug", 'signingConfig = signingConfigs.getByName("release")')
              p.write_text(s)
          elif gradle.exists():
              s = gradle.read_text()
              block = """
          def signingProperties = new Properties()
          def signingFile = rootProject.file("key.properties")
          if (signingFile.exists()) {
              signingProperties.load(new FileInputStream(signingFile))
          }

          """
              s = block + s
              s = s.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file(signingProperties['storeFile'])
                      storePassword signingProperties['storePassword']
                      keyAlias signingProperties['keyAlias']
                      keyPassword signingProperties['keyPassword']
                  }
              }
          """, 1)
              s = s.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              gradle.write_text(s)
          else:
              raise SystemExit("Generated Android Gradle file not found")
          print("Permanent Android release signing configured.")
          PY
      - name: Validate permanent Android signing credentials
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="android/app/plazma-release.jks"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" >/tmp/plazma-keystore-check.txt 2>&1 || {
            echo "Release keystore password check failed:"
            cat /tmp/plazma-keystore-check.txt
            exit 1
          }
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/tmp/plazma-alias-check.txt 2>&1 || {
            echo "Release key alias check failed. Confirm ANDROID_KEY_ALIAS matches the alias inside the keystore."
            cat /tmp/plazma-alias-check.txt
            exit 1
          }
          keytool -certreq -keystore "$KEYSTORE" -storepass "$ANDROID_STORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -file /tmp/plazma-signing-check.csr >/tmp/plazma-key-check.txt 2>&1 || {
            echo "Release private-key password check failed. Confirm ANDROID_KEY_PASSWORD."
            cat /tmp/plazma-key-check.txt
            exit 1
          }
          rm -f /tmp/plazma-signing-check.csr /tmp/plazma-keystore-check.txt /tmp/plazma-alias-check.txt /tmp/plazma-key-check.txt
          echo "Verified: keystore password, key alias, and private-key password are valid."

      - name: Build Android APK
        run: flutter build apk --release
      - name: Verify APK uses permanent release certificate
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature.txt
          APK_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          KEY_CERT="$(keytool -exportcert -keystore android/app/plazma-release.jks -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          echo "APK signer SHA-256: $APK_CERT"
          echo "Keystore SHA-256:   $KEY_CERT"
          test -n "$APK_CERT"
          test "$APK_CERT" = "$KEY_CERT"
          echo "Verified: APK is signed by the permanent Plazma S release certificate."
      - name: Build web preview
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: plazma-s-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Read app version
        id: app_version
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: |
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1 | cut -d+ -f1)"
          test -n "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Generate APK checksum
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.app_version.outputs.tag }}
          target_commitish: main
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          generate_release_notes: false
          body: |
            Plazma S ${{ steps.app_version.outputs.tag }}

            Cross-platform local file and app sharing update.

            Download the Android APK and SHA256 checksum below.

  desktop-build:
    name: Build ${{ matrix.target }} desktop app
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            output: build/linux/x64/release/bundle
          - os: windows-latest
            target: windows
            output: build/windows/x64/runner/Release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - run: flutter create --platforms=windows,linux --org com.plazma --project-name plazma_s .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ${{ matrix.target }} --release
      - name: Bundle Microsoft Visual C++ runtime for Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio locator not found.' }
          $vs = & $vswhere -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation was not found.' }
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          $crt = Get-ChildItem -Path $redistRoot -Directory | Sort-Object Name -Descending | ForEach-Object { Join-Path $_.FullName 'x64\Microsoft.VC143.CRT' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $crt) { throw 'The x64 Microsoft.VC143.CRT runtime folder was not found.' }
          $destination = '${{ matrix.output }}'
          Copy-Item -Path (Join-Path $crt '*') -Destination $destination -Recurse -Force
          foreach ($dll in @('VCRUNTIME140.dll','VCRUNTIME140_1.dll','MSVCP140.dll')) {
            if (-not (Test-Path (Join-Path $destination $dll))) { throw "Required runtime file missing: $dll" }
          }
          @('Extract this entire folder, then run plazma_s.exe.','The Microsoft Visual C++ runtime files are bundled beside the application.','Keep all files in this folder together.') | Set-Content -Path (Join-Path $destination 'README-Windows.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: plazma-s-${{ matrix.target }}
          path: ${{ matrix.output }}
          if-no-files-found: error
