          missing = [item for item in required_manifest if item not in manifest]
          missing += [item for item in required_source if item not in source]
          if missing:
              raise SystemExit("Android app/install wiring is incomplete: " + ", ".join(missing))
          print("Verified: app visibility, base/split export, APK inspection, unknown-source permission, split session commit, and installer result callbacks.")
